<text x="48" y="197" fill="#b8c4d6" font-family="Arial" font-size="17">I enjoy exploring web technologies, programming</text>
<text x="48" y="224" fill="#b8c4d6" font-family="Arial" font-size="17">and turning ideas into practical projects.</text>
