<text x="48" y="55" fill="#ff607e" font-family="Arial" font-size="14" letter-spacing="3">01 / THE PERSON BEHIND THE MASK</text>
<text x="48" y="100" fill="#f8fafc" font-family="Arial" font-size="29" font-weight="700">About Me</text>
<text x="48" y="143" fill="#b8c4d6" font-family="Arial" font-size="17">I am a beginner developer focused on building</text>
